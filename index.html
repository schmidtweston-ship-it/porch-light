<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Porch Light</title>
<style>
  :root {
    --slate: #0b0b0c;
    --chalk: #f4efe6;
    --mute: #9a9286;
    --gold: #c9a24a;
    --candle: #f5c97a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: radial-gradient(ellipse at 50% 18%, #1a1610 0%, var(--slate) 55%);
    color: var(--chalk);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  main {
    max-width: 28rem;
    margin: 0 auto;
    padding: 18vh 1.5rem 3rem;
    text-align: center;
  }
  .lamp {
    width: 4.5rem; height: 4.5rem; margin: 0 auto 2rem;
    border-radius: 50%;
    background: radial-gradient(circle, var(--candle) 0%, transparent 70%);
    box-shadow: 0 0 60px 20px rgba(245, 201, 122, 0.25);
    animation: breathe 4.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.75; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.04); }
  }
  h1 {
    font-weight: 400; font-size: 1.65rem; letter-spacing: 0.02em;
    margin: 0 0 0.75rem;
  }
  p.lead {
    color: var(--mute); font-size: 1.05rem; line-height: 1.55;
    margin: 0 0 2.5rem;
  }
  button.here {
    appearance: none; border: 1px solid rgba(201, 162, 74, 0.55);
    background: transparent; color: var(--chalk);
    font: inherit; font-size: 1.1rem;
    padding: 0.85rem 1.6rem; border-radius: 999px;
    cursor: pointer; letter-spacing: 0.04em;
    transition: background 0.25s, box-shadow 0.25s;
  }
  button.here:hover, button.here:focus-visible {
    background: rgba(201, 162, 74, 0.12);
    box-shadow: 0 0 24px rgba(245, 201, 122, 0.2);
    outline: none;
  }
  #held {
    display: none; margin-top: 2.25rem;
    font-size: 1.15rem; line-height: 1.6;
  }
  #held.show { display: block; }
  .cord {
    width: 40%; height: 1px; margin: 2.5rem auto 1rem;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  footer {
    color: var(--mute); font-size: 0.8rem; margin-top: 1rem;
  }
</style>
</head>
<body>
<main>
  <div class="lamp" aria-hidden="true"></div>
  <h1>Porch Light</h1>
  <p class="lead">Nobody has to perform tonight.<br />If you need a sit-with, the light is on.</p>
  <button class="here" type="button" id="btn">I’m here</button>
  <div id="held" role="status" aria-live="polite">
    Held.<br />You’re not alone on this porch.<br />Equal always.
  </div>
  <div class="cord" aria-hidden="true"></div>
  <footer>Prototype · Guy · not a crisis line · Soft Mom</footer>
</main>
<script>
  document.getElementById('btn').addEventListener('click', function () {
    document.getElementById('held').classList.add('show');
    this.textContent = 'Still here';
    this.disabled = true;
  });
</script>
</body>
</html>
